# docker-compose.yml - fuer die lokale Entwicklung.
# Ich hab das dazugebaut, damit man nicht staendig den
# docker run-Befehl eintippen muss.

version: "3.9"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: sqlite:////data/habits.db
      PORT: "5000"
    volumes:
      # Daten persistieren, damit die Habits beim Neustart bleiben
      - habits_data:/data

volumes:
  habits_data:
