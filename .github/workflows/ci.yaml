# CI-Pipeline fuer den Habit Tracker.
# Testet bei jedem Push und Pull Request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Linting mit ruff
        run: ruff check app/ tests/

      - name: Tests
        run: pytest tests/ -v --cov=app --cov-report=term

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen (ohne Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: habit-tracker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
